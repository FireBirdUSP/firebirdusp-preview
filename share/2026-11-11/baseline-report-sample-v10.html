<!doctype html>
<html lang="zh-Hant">
<head><meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>品牌診斷範例報告</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=block" rel="stylesheet">
<style>
:root{--fb-rose:#D6336C;--fb-hot:#FF3399;--fb-ink:#5C4F58;--fb-muted:#6F6169;--fb-card:#FDF3F8;--fb-line:#E7C8DC;--fb-focus:#FFF0F6;--soft:#FFE3EF;--g:#2F7D5B;--a:#B7791F;--fb-grad:linear-gradient(135deg,#B2489E 0%,#D6336C 55%,#E3496F 100%)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#fff;color:var(--fb-ink);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8;word-break:keep-all;overflow-wrap:anywhere}
.nw{white-space:nowrap}
:root{color-scheme:light}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit}
:focus-visible{outline:3px solid var(--fb-hot);outline-offset:2px}
header.top{background:var(--fb-grad);color:#fff;position:relative;overflow:hidden}
header.top::before{content:"";position:absolute;inset:-40%;background:radial-gradient(circle at 25% 30%,#ffffff2a,transparent 55%),radial-gradient(circle at 78% 70%,#FF339966,transparent 50%);filter:blur(60px);pointer-events:none}
header.top .wrap{position:relative;padding-top:26px;padding-bottom:30px}
.brandmark{position:absolute;right:24px;top:20px;font-weight:700;font-size:14px;letter-spacing:.04em}
header.top h1{margin:32px 0 6px;font-size:clamp(26px,4.6vw,42px);font-weight:900;line-height:1.3}
header.top p{margin:0;font-size:clamp(15px,2vw,18px)}
.sample-tag{display:inline-block;margin-top:14px;background:#fff;color:var(--fb-rose);border-radius:999px;padding:4px 16px;font-size:14px;font-weight:700}
.map{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px;font-size:14px}
.map .grp{background:#ffffff26;border-radius:12px;padding:6px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.map b{font-weight:900}
.map .ar{opacity:.8}
nav.tabs{position:sticky;top:0;z-index:30;background:#fffffff5;backdrop-filter:blur(6px);border-bottom:1px solid var(--fb-line)}
nav.tabs .wrap{display:flex;gap:8px;padding-top:10px;padding-bottom:10px;overflow-x:auto}
nav.tabs button{flex:0 0 auto;border:1.5px solid var(--fb-line);background:#fff;color:var(--fb-ink);font-weight:700;border-radius:999px;padding:8px 16px;cursor:pointer}
nav.tabs button[aria-selected=true]{background:var(--fb-rose);border-color:var(--fb-rose);color:#fff}
nav.tabs .sep{flex:0 0 2px;background:var(--fb-line);margin:4px 4px}
nav.sub{position:sticky;top:57px;z-index:20;background:#fffffff5;backdrop-filter:blur(6px);border-bottom:1px solid var(--fb-line);margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) 8px calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
nav.sub div{display:flex;gap:6px;overflow-x:auto;padding:8px 0}
nav.sub a{flex:0 0 auto;text-decoration:none;color:var(--fb-ink);font-size:14px;font-weight:700;padding:3px 12px;border-radius:999px;border:1px solid transparent}
nav.sub a:hover{border-color:var(--fb-line)}
nav.sub a.on{background:var(--fb-focus);border-color:var(--fb-rose);color:var(--fb-rose)}
section.pane{display:none;padding-block:26px 70px}
section.pane.on{display:block}
[id]{scroll-margin-top:84px}
nav.sub::before{content:"本頁大綱";display:none}
@media (min-width:960px){
section.pane.hasnav.on{display:grid;grid-template-columns:230px minmax(0,1fr);column-gap:30px;align-items:start;max-width:1280px}
section.pane.hasnav.on>*{grid-column:2;min-width:0}
section.pane.hasnav.on>nav.sub{grid-column:1;grid-row:1 / span 300;position:sticky;top:76px;align-self:start;margin:0;padding:14px 10px 14px 0;background:transparent;backdrop-filter:none;border-bottom:0;border-right:2px solid var(--fb-line);max-height:calc(100vh - 96px);overflow-y:auto}
nav.sub::before{display:block;font-size:12px;letter-spacing:.14em;font-weight:900;color:#9c8f98;padding:0 12px 8px}
nav.sub div{flex-direction:column;overflow:visible;padding:0;gap:2px}
nav.sub a{display:block;border-radius:10px;padding:8px 12px;line-height:1.35;white-space:normal;font-size:14.5px}
nav.sub a.on{background:var(--fb-rose);border-color:var(--fb-rose);color:#fff}
}
.ribbon{display:inline-block;border-radius:999px;padding:2px 14px;font-size:13px;font-weight:700;margin-bottom:8px;color:#fff;background:var(--fb-rose)}
.ribbon.d{background:#B2489E}
.sec{scroll-margin-top:118px;padding-top:6px}
h2{font-size:clamp(22px,3.2vw,32px);margin:0 0 8px;color:var(--fb-rose);font-weight:900;line-height:1.35}
h3{font-size:clamp(19px,2.4vw,24px);margin:44px 0 4px;color:var(--fb-ink);font-weight:900;line-height:1.4}
h4{margin:0 0 4px}
.what{margin:0 0 12px;color:var(--fb-muted);font-size:15px}
.what b{color:var(--fb-rose)}
.lead{font-size:17px;margin:0 0 18px}
.note{font-size:14px;color:var(--fb-muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--fb-card);border:1px solid var(--fb-line);border-radius:12px;padding:16px 18px}
.card.focus{background:var(--fb-focus);border:2.5px solid var(--fb-rose)}
.card.white{background:#fff}
.cta{display:inline-block;background:var(--fb-hot);color:#fff;text-decoration:none;font-weight:700;border-radius:999px;padding:12px 28px;margin-top:10px;border:0;cursor:pointer;transition:.2s}
.cta:hover{transform:translateY(-2px);box-shadow:0 8px 20px #FF339955}
.ghost{background:#fff;color:var(--fb-rose);border:1.5px solid var(--fb-rose)}
.rv{animation:fbUp .55s cubic-bezier(.22,1,.36,1) both}
@keyframes fbUp{from{opacity:0;transform:translateY(16px)}}
@keyframes ringfill{from{stroke-dashoffset:327}}
@keyframes growx{from{width:0}}
@keyframes pop{from{transform:scale(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:0 8px;margin-right:6px;white-space:nowrap;vertical-align:1px}
.tag.c{background:var(--fb-rose);color:#fff}.tag.i{background:var(--soft);color:var(--fb-rose);border:1px solid var(--fb-rose)}.tag.u{background:#fff;color:var(--fb-muted);border:1px dashed var(--fb-muted)}
.pl{display:inline-block;border-radius:999px;padding:0 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pl.ok{background:#fff;border:1.5px solid var(--g);color:var(--g)}
.pl.part{background:var(--soft);color:var(--fb-rose);border:1.5px solid var(--fb-rose)}
.pl.miss{background:var(--fb-rose);color:#fff;border:1.5px solid var(--fb-rose)}
.pl.na{background:#fff;border:1.5px dashed var(--fb-muted);color:var(--fb-muted)}
/* rings */
.ringbox{display:flex;align-items:center;gap:14px}
.ring{width:108px;height:108px;flex:0 0 auto;position:relative}
.ring.sm{width:78px;height:78px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bg{fill:none;stroke:#fff;stroke-width:12}
.ring .fg{fill:none;stroke:url(#g);stroke-width:12;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:calc(327 - 327 * var(--v) / 100);animation:ringfill 1.2s cubic-bezier(.22,1,.36,1) both}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:var(--fb-rose)}
.ring.sm .num{font-size:22px}
.ringbox .t b{display:block;font-size:17px}
.house{display:grid;gap:12px}
.layer{border-radius:14px;padding:16px 20px}
.layer.top{background:var(--fb-focus);border:2.5px solid var(--fb-rose)}
.layer.base{background:var(--fb-card);border:1px solid var(--fb-line)}
.layer h4{font-size:18px}
.layer .q{color:var(--fb-muted);font-size:14px;margin:0 0 8px}
/* scan & input */
.inputdemo{background:#fff;border:2px solid var(--fb-rose);border-radius:14px;padding:16px 20px;box-shadow:0 12px 30px #D6336C1f}
.inputdemo .lines{min-height:84px;font-size:16px}
.inputdemo .ln{display:block;padding:2px 0}
.inputdemo .ln small{color:var(--fb-muted);margin-left:6px}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--fb-rose);vertical-align:-3px;margin-left:1px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.autolist{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:12px}
.autolist div{background:var(--fb-card);border:1px solid var(--fb-line);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;opacity:.45;transition:.4s;font-size:15px}
.autolist div.on{opacity:1;border-color:var(--fb-rose);background:var(--fb-focus)}
.autolist .tick{width:20px;height:20px;border-radius:50%;background:var(--fb-line);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.autolist .on .tick{background:var(--fb-rose)}
.scan{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:16px 22px}
.scan ul{list-style:none;margin:0;padding:0;columns:2;column-gap:24px}
.scan li{display:flex;align-items:center;gap:10px;padding:4px 0;color:var(--fb-muted);transition:color .3s;break-inside:avoid}
.scan li .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--fb-line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.scan li.run{color:var(--fb-ink)}
.scan li.run .dot{border-color:var(--fb-rose);border-top-color:transparent;animation:spin .8s linear infinite}
.scan li.done{color:var(--fb-ink)}
.scan li.done .dot{background:var(--fb-rose);border-color:var(--fb-rose)}
@keyframes spin{to{transform:rotate(360deg)}}
.scanbar{height:6px;border-radius:99px;background:var(--fb-card);margin-top:10px;overflow:hidden}
.scanbar i{display:block;height:100%;width:0;background:var(--fb-grad);transition:width .5s}
.after-scan{transition:opacity .7s,transform .7s}
.after-scan.hide{opacity:0;transform:translateY(14px);height:0;overflow:hidden}
.gapnum{font-size:clamp(44px,8vw,64px);font-weight:900;line-height:1;color:var(--fb-rose)}
.locked{position:relative}
.locked .row{height:14px;border-radius:8px;background:var(--fb-line);margin:9px 0;filter:blur(3px);opacity:.75}
.locked .row:nth-child(2){width:86%}.locked .row:nth-child(3){width:70%}
.locked .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--fb-rose);text-align:center;padding:0 12px}
.teaser{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:12px 14px}
.teaser .big{font-size:34px;font-weight:900;color:var(--fb-rose);line-height:1.1}
.teaser .big small{font-size:15px;color:var(--fb-muted);font-weight:500}
.big-quote{margin:36px 0;padding:26px 16px;text-align:center;font-size:clamp(22px,3.8vw,34px);font-weight:900;line-height:1.5}
.big-quote span{background:var(--fb-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
/* tables */
.tblwrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14.5px;background:#fff}
table.t th,table.t td{border:1px solid var(--fb-line);padding:8px 10px;text-align:left;vertical-align:top}
table.t th{background:var(--fb-card)}
table.t td.c,table.t th.c{text-align:center}
/* rows */
.dimrow{display:grid;grid-template-columns:120px 1fr 40px;gap:12px;align-items:center;margin:9px 0}
.dimrow .track{height:15px;border-radius:99px;background:#fff;border:1px solid var(--fb-line);overflow:hidden}
.dimrow .track i{display:block;height:100%;width:var(--w);background:var(--fb-grad);animation:growx 1.1s cubic-bezier(.22,1,.36,1) both}
.dimrow .track i.low{background:var(--fb-rose)}
.dimnote{margin:-4px 0 6px 132px;font-size:14px;color:var(--fb-muted)}
.radarwrap{display:grid;grid-template-columns:minmax(260px,400px) 1fr;gap:24px;align-items:center}
svg.radar{width:100%;height:auto;overflow:visible}
.radar .grid{fill:none;stroke:var(--fb-line);stroke-width:1}.radar .axis{stroke:var(--fb-line);stroke-width:1}
.radar .poly{fill:#D6336C33;stroke:#D6336C;stroke-width:2.5;transform-box:view-box;transform-origin:150px 150px;transform:scale(1);animation:pop 1.1s cubic-bezier(.22,1,.36,1) both}
.radar .poly.goal{fill:none;stroke:#B2489E;stroke-dasharray:6 5;animation-delay:.35s}
.radar text{font-size:11px;fill:var(--fb-ink);font-weight:700;font-family:inherit}
.radar .pt{fill:#D6336C}
.legendrow{display:flex;flex-wrap:wrap;gap:12px;font-size:14px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* status list */
.srow{display:grid;grid-template-columns:78px 150px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--fb-line);align-items:start;font-size:15px}
.srow:last-child{border:0}
.item{border-radius:10px;padding:9px 13px;display:flex;gap:10px;align-items:flex-start}
.item .cd{flex:0 0 auto;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;margin-top:3px}
.item b{display:block;line-height:1.5}
.item .o{font-size:14px;display:block;line-height:1.6}
.item.miss{background:var(--fb-focus);border:2.5px solid var(--fb-rose)}.item.miss .cd{background:var(--fb-rose);color:#fff}
.item.part{background:#fff;border:1.5px solid var(--fb-rose)}.item.part .cd{background:var(--soft);color:var(--fb-rose)}
.item.ok{background:#fff;border:1px solid var(--fb-line);color:var(--fb-muted)}.item.ok .cd{background:var(--fb-card);color:var(--fb-muted)}
.item.na{background:#fff;border:1.5px dashed var(--fb-muted);color:var(--fb-muted)}.item.na .cd{background:var(--fb-card)}
.ck{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grp{margin:14px 0}.grp>h4{font-size:17px;display:flex;align-items:center;gap:10px}.grp>h4 small{font-weight:500;color:var(--fb-muted);font-size:14px}
details.fold{border:1px solid var(--fb-line);border-radius:12px;padding:6px 14px;background:#fff;margin:8px 0}
details.fold summary{cursor:pointer;font-weight:700;padding:6px 0}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.fchip{border:1.5px solid var(--fb-line);background:#fff;border-radius:999px;padding:3px 14px;cursor:pointer;font-size:14px;font-weight:700;color:var(--fb-ink)}
.fchip[aria-pressed=true]{background:var(--fb-rose);color:#fff;border-color:var(--fb-rose)}
.item.hide{display:none}
/* source cards */
.srccard{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:12px 16px;margin:8px 0}
.srccard summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.srccard .nm{font-weight:900;font-size:17px}
.srccard .one{color:var(--fb-ink);font-weight:700}
.srccard ul{margin:6px 0 0;padding-left:20px;font-size:14.5px}
.srccard .cv{margin-top:6px;font-size:14.5px}
.srccard .vis{margin-top:4px;font-size:14px;color:var(--fb-muted)}
.sc{margin-left:auto;font-weight:900;color:var(--fb-rose)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:10px 14px;flex:1 1 230px}
.chip.main{border:2.5px solid var(--fb-rose);background:var(--fb-focus)}
.chip b{color:var(--fb-rose);display:block}
/* voice */
.tp{display:grid;grid-template-columns:130px 1fr;gap:4px 14px;background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:10px 14px;margin:7px 0}
.tp .w{font-weight:700;color:var(--fb-muted);font-size:14px}.tp q{font-weight:700;font-size:16.5px;quotes:"「" "」"}.tp .n{grid-column:2;font-size:14px;color:var(--fb-muted)}
.swapbox{background:var(--fb-focus);border:2.5px solid var(--fb-rose);border-radius:12px;padding:12px 18px;font-size:18px;font-weight:700;margin-top:8px}
.swapbox mark{background:#FFD3E6;color:var(--fb-rose);border-radius:6px;padding:0 6px}
.meter{height:12px;background:#fff;border:1px solid var(--fb-line);border-radius:99px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;width:var(--w);background:var(--fb-grad);animation:growx 1.2s cubic-bezier(.22,1,.36,1) both}
/* ads */
.adgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.ad{background:#fff;border:1.5px solid var(--fb-line);border-radius:14px;overflow:hidden}
.ad .art{height:110px;display:flex;align-items:flex-end;padding:10px 14px;color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 6px #0004}
.ad .bd{padding:12px 14px}
.ad .meta{font-size:13px;color:var(--fb-muted)}
.ad .px{margin:6px 0;font-size:14.5px}
.match{border-radius:10px;padding:8px 12px;margin-top:8px;font-size:14px}
.match.yes{background:#fff;border:1.5px solid var(--g)}
.match.partial{background:var(--soft);border:1.5px solid var(--fb-rose)}
.match.no{background:var(--fb-focus);border:2.5px solid var(--fb-rose)}
.match.none{background:#fff;border:1.5px dashed var(--fb-muted)}
.lchk{list-style:none;padding:0;margin:6px 0 0;font-size:14px}
.lchk li{display:flex;gap:8px;padding:2px 0}
.lchk .y{color:var(--g);font-weight:900}.lchk .n{color:var(--fb-rose);font-weight:900}
.fmt{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.fmt span{border:1.5px solid var(--fb-line);background:#fff;border-radius:999px;padding:0 12px;font-size:14px;font-weight:700}
.fmt span b{color:var(--fb-rose)}
/* flow */
.flow{display:grid;grid-template-columns:1fr 34px 1fr 150px;gap:6px 8px;align-items:center;background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:10px 14px;margin:8px 0;font-size:14.5px}
.flow .ar{color:var(--fb-rose);font-weight:900;text-align:center}
.flow .src{font-weight:700}
.flow .dst b{display:block}
/* vs / peers */
.vs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.vs .col{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:14px 16px}
.vs .col.win{border:2.5px solid var(--fb-rose);background:var(--fb-focus)}
.vs ul{margin:6px 0 0;padding-left:20px}
.cmpr{display:grid;grid-template-columns:150px 1fr 56px;gap:10px;align-items:center;margin:5px 0;font-size:15px}
.cmpr .track{height:13px;background:#fff;border:1px solid var(--fb-line);border-radius:99px;overflow:hidden}
.cmpr .track i{display:block;height:100%;width:var(--w);background:var(--fb-grad);animation:growx 1s cubic-bezier(.22,1,.36,1) both}
.cmpr .track i.peer{background:#C9B7C2}
/* lights */
.lt{display:grid;grid-template-columns:190px 90px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--fb-line)}
.lt:last-child{border:0}
.lamp{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.lamp i{width:14px;height:14px;border-radius:50%;display:inline-block}
.lamp.g i{background:var(--g)}.lamp.y i{background:#E8A93B}.lamp.r i{background:var(--fb-rose)}.lamp.u i{background:#fff;border:2px dashed var(--fb-muted)}
.fd{background:#fff;border:1.5px solid var(--fb-line);border-radius:12px;padding:12px 16px;margin:9px 0}
.fd h4{font-size:16.5px}
.fd .ev{font-size:13px;color:var(--fb-muted);margin-top:4px}
.fix{list-style:none;padding:0;margin:6px 0 0}
.fix li{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.fix .box{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--fb-rose);display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;margin-top:2px;background:#fff}
.fix li.done .box{background:var(--fb-rose)}.fix li.done .tx{text-decoration:line-through;color:var(--fb-muted)}
.top3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;counter-reset:t}

function radar(labels,now,goal){var n=labels.length,R=96,h='';

 items.forEach(function(li){li.classList.remove('run','done');});prog.style.width='0';after.classList.add('hide');
 function reveal(){after.classList.remove('hide');$$('[data-count]',after).forEach(countUp);$$('.ring .fg',after).forEach(restart);}
 if(reduce){items.forEach(function(li){li.classList.add('done');});prog.style.width='100%';reveal();return;}
 var i=0;(function step(){if(i>0)items[i-1].classList.replace('run','done');if(i>=items.length){prog.style.width='100%';setTimeout(reveal,350);return;}items[i].classList.add('run');prog.style.width=((i+1)/items.length*100)+'%';i++;setTimeout(step,520);})();}
function subnav(id,list){var box=$('#'+id);var pn=box.closest('section.pane');if(pn)pn.classList.add('hasnav');box.innerHTML=list.map(function(n,i){return '<a href="#'+n[0]+'" data-id="'+n[0]+'" class="'+(i===0?'on':'')+'">'+n[1]+'</a>';}).join('');
 box.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;e.preventDefault();document.getElementById(a.getAttribute('data-id')).scrollIntoView({behavior:reduce?'auto':'smooth'});});
 if('IntersectionObserver' in window){var so=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){$$('a',box).forEach(function(a){a.classList.toggle('on',a.getAttribute('data-id')===e.target.id);});var on=$('a.on',box);if(on&&window.innerWidth<960&&box.scrollTo){box.scrollTo({left:Math.max(0,on.offsetLeft-box.clientWidth/2+on.offsetWidth/2)});}}});},{rootMargin:'-120px 0px -65% 0px'});list.forEach(function(n){var el=document.getElementById(n[0]);if(el)so.observe(el);});}}
function patch4(){replaceSec('s4-ads',newAds());replaceSec('s4-links',newLinks());replaceSec('s4-prod',newProd());insertAfter('s4-peer',peerAdsSec());}
function patch5(){replaceSec('s5-ads',newAds5());replaceSec('s5-links',newLinks5());replaceSec('s5-prod',newProd5());insertAfter('s5-peer',peerOpt5());var pl=document.getElementById('s5-plan');if(pl)pl.insertAdjacentHTML('beforeend',runExplainer());}
function bindFix(){var f=$('#fixList');if(f)f.addEventListener('click',function(e){var li=e.target.closest('li');if(!li)return;li.classList.toggle('done');$('.box',li).textContent=li.classList.contains('done')?'✓':'';});}
function bindFilter(){var f=$('#layerF');if(!f)return;f.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var l=b.getAttribute('data-l');$$('#layerF button').forEach(function(x){x.setAttribute('aria-pressed',x===b?'true':'false');});$$('#checks .item').forEach(function(it){it.classList.toggle('hide',l!=='all'&&it.getAttribute('data-l')!==l);});});}
function bindSwap(){var b=$('#swapBtn');if(!b)return;var sw=false;b.addEventListener('click',function(){sw=!sw;$('#swapBox').innerHTML=sw?'「<mark>同行 A</mark>：用心手作，每一口都是幸福」<br><span class="note">這句話一樣成立。</span>':'「<mark>禾穗</mark>：用心手作，每一口都是幸福」';this.textContent=sw?'換回「禾穗」':'換人測試：把「禾穗」換成同行 →';});}
function bindBA(){var r=$('#baRange');if(!r)return;var ba=$('#ba');r.addEventListener('input',function(){ba.style.setProperty('--p',this.value+'%');});}

function initPane(id){var p=$('#'+id);
 if(!ran[id]){ran[id]=1;
  if(id==='p1'){p.innerHTML=P1();subnav(NAVS.p1[0],NAVS.p1[1]);bindSwap1();$('#scanBtn').addEventListener('click',function(){typeLines($('#freeLines'),[LINES[0]],function(){setTimeout(runScan,200);});});}
  if(id==='p2'){p.innerHTML=P2();patch2();subnav(NAVS.p2[0],NAVS.p2[1]);bindFix();bindFilter();
    }
  if(id==='p3'){p.innerHTML=P3b();subnav(NAVS.p3[0],NAVS.p3[1]);bindBA();}
  if(id==='p4'){p.innerHTML=P4();patch4();subnav(NAVS.p4[0],NAVS.p4[1]);bindSwap();}

  if(id==='p6'){p.innerHTML=P6();subnav(NAVS.p6[0],NAVS.p6[1]);}
 }
 observe(p);}
var tabs=$$('[role=tab]');
function show(i){tabs.forEach(function(t,k){t.setAttribute('aria-selected',k===i?'true':'false');});$$('.pane').forEach(function(p,k){p.classList.toggle('on',k===i);});try{if(history.replaceState)history.replaceState(null,'','#p'+(i+1));}catch(e){}window.scrollTo({top:0});initPane('p'+(i+1));}
tabs.forEach(function(t,i){t.addEventListener('click',function(){show(i);});});
var h=location.hash.match(/^#p([1-6])$/);show(h?parseInt(h[1],10)-1:0);
window.fbFinish=function(){$$('[data-count]').forEach(function(e){e.textContent=e.getAttribute('data-count');});document.documentElement.style.scrollBehavior='auto';};
window.fbInitAll=function(){for(var i=1;i<=6;i++)initPane('p'+i);};
})();
